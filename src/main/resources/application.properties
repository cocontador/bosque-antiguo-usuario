
#CONFIGURACI�N GENERAL DE LA APLICACI�N
spring.application.name=Usuario
server.port=8082

#CONFIGURACI�N DE BASE DE DATOS (MySQL)
# Oracle Database Configuration
spring.datasource.url=jdbc:oracle:thin:@localhost:1521:xe
spring.datasource.username=admin
spring.datasource.password=Constanza2025.
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA/Hibernate Configuration para Oracle
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

#CONFIGURACI�N DE JWT
#Clave secreta (usa una cadena segura de al menos 32 caracteres)
app.jwt.secret=mySecretKeySuperSeguraDeEjemplomySecretKeySuperSeguraDeEjemplomySecretKeySuperSeguraDeEjemplo
# Tiempo de expiraci�n del token de acceso (en milisegundos)
app.jwt.expiration=900000
  # 15 minutos
#Tiempo de expiraci�n del token de refresco (en milisegundos)
app.jwt.refreshExpiration=1209600000
 # 14 d�as

#CONFIGURACI�N DE LOGS Y ERRORES
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
server.error.include-message=always
server.error.include-binding-errors=always

#CONFIGURACI�N DE OPENAPI / SWAGGER
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

