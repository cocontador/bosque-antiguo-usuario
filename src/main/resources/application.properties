
#CONFIGURACIÓN GENERAL DE LA APLICACIÓN
spring.application.name=Usuario
server.port=8080

#CONFIGURACIÓN DE BASE DE DATOS (MySQL)
spring.datasource.url=jdbc:mysql://localhost:3306/usuario_db?serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

#Generación automática del esquema (opciones: none | validate | update | create | create-drop)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

#CONFIGURACIÓN DE JWT
#Clave secreta (usa una cadena segura de al menos 32 caracteres)
app.jwt.secret=c3p5t3p5c3p5t3p5c3p5t3p5c3p5t3p5
# Tiempo de expiración del token de acceso (en milisegundos)
app.jwt.expiration=900000
  # 15 minutos
#Tiempo de expiración del token de refresco (en milisegundos)
app.jwt.refreshExpiration=1209600000
 # 14 días

#CONFIGURACIÓN DE LOGS Y ERRORES
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
server.error.include-message=always
server.error.include-binding-errors=always

#CONFIGURACIÓN DE OPENAPI / SWAGGER
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

#PERFIL ACTIVO (opcional)
#spring.profiles.active=dev
